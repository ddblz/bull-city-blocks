name: Deploy

# Deploys the game server (a Worker with one Durable Object per room) and the web client
# (Cloudflare Pages) from main (#40, SPEC §7). Never runs on pull requests.
# Needs the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; skips until they're set.
# Optional repo variables WEB_DOMAIN and API_DOMAIN (both or neither) put the site and the game
# server on a custom domain (#51, SPEC §7); without them it uses workers.dev and pages.dev.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  secrets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: secrets
    if: github.ref == 'refs/heads/main' && needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Checks the custom domains (both or neither) before anything is deployed.
      - name: Check the custom domains
        id: targets
        run: node scripts/deploy-targets.cli.mjs
        env:
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}

      - name: Deploy the game server
        id: worker
        working-directory: apps/worker
        run: |
          # WORKER_ARGS is "--domain <API_DOMAIN>" or empty, and was validated above.
          pnpm exec wrangler deploy $WORKER_ARGS | tee deploy.log
          url="$API_URL"
          [ -n "$url" ] || url=$(grep -o 'https://[^ ]*\.workers\.dev' deploy.log | head -1)
          test -n "$url" || { echo "::error::no server URL in the deploy output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          WORKER_ARGS: ${{ steps.targets.outputs.worker_args }}
          API_URL: ${{ steps.targets.outputs.api_url }}

      - name: Build the web client against it
        run: pnpm --filter @bull-city-blocks/web build
        env:
          VITE_SERVER: ${{ steps.worker.outputs.url }}

      - name: Deploy the web client to Pages
        working-directory: apps/worker
        run: |
          pnpm exec wrangler pages project create bull-city-blocks --production-branch main || true
          pnpm exec wrangler pages deploy ../web/dist --project-name bull-city-blocks --branch main

      - name: Attach the custom domain to Pages
        if: steps.targets.outputs.pages_domain != ''
        run: node scripts/pages-domain.cli.mjs
        env:
          PAGES_DOMAIN: ${{ steps.targets.outputs.pages_domain }}
          PROJECT: bull-city-blocks
