<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 390" width="844" height="390" font-family="system-ui, sans-serif" font-size="11">
  <title>Tabletop layout, landscape (wireframe)</title>
  <rect width="844" height="390" fill="#faf5ee"/>
  <!-- thin pinned header -->
  <rect x="0" y="0" width="844" height="32" fill="#fff" stroke="#d8cfc4"/>
  <text x="12" y="21" font-weight="700">Turn 7 · ●●○ · 0:42</text><text x="640" y="21">Players · Log · Map · Updates 2</text>
  <!-- opponents across the top, like people across a table -->
  <g stroke="#8c716b" fill="#fff"><rect x="8" y="38" width="196" height="84" rx="8"/><rect x="212" y="38" width="196" height="84" rx="8"/><rect x="416" y="38" width="196" height="84" rx="8"/><rect x="620" y="38" width="216" height="84" rx="8"/></g>
  <g font-weight="700"><text x="18" y="56">Ben</text><text x="222" y="56">Cy</text><text x="426" y="56">Dee</text><text x="630" y="56">Eli</text></g>
  <g>
    <rect x="18" y="64" width="22" height="30" rx="3" fill="#7E22CE"/><rect x="28" y="64" width="22" height="30" rx="3" fill="#7E22CE" stroke="#fff"/><rect x="38" y="64" width="22" height="30" rx="3" fill="#7E22CE" stroke="#fff"/>
    <rect x="70" y="64" width="22" height="30" rx="3" fill="#15803D"/><rect x="80" y="64" width="22" height="30" rx="3" fill="#15803D" stroke="#fff"/>
    <rect x="118" y="70" width="22" height="24" rx="3" fill="#c8a24a"/><text x="146" y="86">$7</text><text x="18" y="112" fill="#58413c">3/3 · 2/3 · 5 in hand</text>
  </g>
  <text x="222" y="86" fill="#58413c">same, per opponent</text><text x="426" y="86" fill="#58413c">same, per opponent</text><text x="630" y="86" fill="#58413c">same, per opponent</text>
  <!-- left: my tableau and bank -->
  <rect x="8" y="130" width="470" height="164" rx="8" fill="#fff" stroke="#8c716b"/>
  <text x="18" y="148" fill="#58413c">YOUR DISTRICTS AND BANK (overlapped)</text>
  <g>
    <rect x="18" y="156" width="46" height="64" rx="4" fill="#D97706"/><rect x="38" y="156" width="46" height="64" rx="4" fill="#D97706" stroke="#fff"/>
    <rect x="130" y="156" width="46" height="64" rx="4" fill="#BE123C"/><rect x="150" y="156" width="46" height="64" rx="4" fill="#BE123C" stroke="#fff"/><rect x="170" y="156" width="46" height="64" rx="4" fill="#BE123C" stroke="#fff"/>
    <rect x="250" y="156" width="46" height="64" rx="4" fill="#0D9488"/>
    <rect x="370" y="160" width="46" height="60" rx="4" fill="#c8a24a"/><rect x="386" y="160" width="46" height="60" rx="4" fill="#c8a24a" stroke="#fff"/>
    <text x="18" y="236">Old West 2/3</text><text x="130" y="236">Trinity Pk FULL</text><text x="250" y="236">N Durham 1/3</text><text x="370" y="236">Bank $9</text>
  </g>
  <!-- middle right: piles and the since-last-move banner -->
  <rect x="486" y="130" width="350" height="164" rx="8" fill="#f1e8dc" stroke="#d8cfc4"/>
  <rect x="504" y="146" width="48" height="66" rx="4" fill="#a6331b"/><text x="504" y="228" font-size="10">Draw 84</text>
  <rect x="576" y="146" width="48" height="66" rx="4" fill="#fff" stroke="#8c716b"/><text x="576" y="228" font-size="10">Discard</text>
  <rect x="650" y="150" width="176" height="52" rx="8" fill="#fff" stroke="#a6331b"/><text x="662" y="180" font-weight="700">Since last move ›</text>
  <!-- bottom: hand fan, actions at the right edge -->
  <g stroke="#8c716b">
    <rect x="12" y="302" width="76" height="88" rx="6" fill="#3B82F6"/><rect x="62" y="302" width="76" height="88" rx="6" fill="#1E3A8A"/><rect x="112" y="302" width="76" height="88" rx="6" fill="#0D9488"/>
    <rect x="162" y="296" width="76" height="94" rx="6" fill="#EA580C"/><rect x="212" y="302" width="76" height="88" rx="6" fill="#B45309"/><rect x="262" y="302" width="76" height="88" rx="6" fill="#0891B2"/><rect x="312" y="302" width="76" height="88" rx="6" fill="#5E61F1"/>
  </g>
  <g font-weight="700"><rect x="520" y="306" width="84" height="40" rx="8" fill="#fff" stroke="#a6331b"/><text x="548" y="331">Play</text>
  <rect x="612" y="306" width="84" height="40" rx="8" fill="#fff" stroke="#a6331b"/><text x="640" y="331">Bank</text>
  <rect x="706" y="306" width="124" height="40" rx="8" fill="#a6331b"/><text x="738" y="331" fill="#fff">End turn</text></g>
  <text x="520" y="372" font-size="9" fill="#58413c">Hand and actions live along the bottom edge, as the cards do in your hands; the table is never scrolled.</text>
</svg>
